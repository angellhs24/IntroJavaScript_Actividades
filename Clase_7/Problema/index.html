<div class="card">
    <h2>Password Generator</h2>
    <div class="display-container">
        <input type="text" id="password-display" readonly placeholder="P4$5W0rD!">
    </div>

    <div class="settings">
        <label>Character Length: <span id="length-val">10</span></label>
        <input type="range" id="length-slider" min="8" max="20" value="10">

        <div class="options">
            <label><input type="checkbox" id="uppercase" checked> Include Uppercase Letters</label>
            <label><input type="checkbox" id="lowercase" checked> Include Lowercase Letters</label>
            <label><input type="checkbox" id="numbers" checked> Include Numbers</label>
            <label><input type="checkbox" id="symbols"> Include Symbols</label>
        </div>

        <button id="generate-btn">GENERATE →</button>
    </div>
</div>

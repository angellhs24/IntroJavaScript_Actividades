<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Caja de Comentarios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Deja un comentario</h2>

            <textarea id="comment-input" placeholder="Escribe algo aquí..." required></textarea>
            <button type="submit" id="add-comment">Publicar Comentario</button>
        </form>

        <div id="comments-container">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
